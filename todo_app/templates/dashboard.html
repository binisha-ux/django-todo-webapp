<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 20px;
            background-color: #f9f9f9;
        }

        .dashboard-container {
            display: flex;
            gap: 30px;
            width: 100%;
            align-items: flex-start;
        }

        /* Left Side: Form */
        .form-section {
            flex: 0 0 450px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            text-transform: lowercase;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        textarea.form-control {
            height: 100px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-add {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-add:hover {
            background-color: #0056b3;
        }

        .divider {
            width: 1px;
            background-color: #e0e0e0;
            align-self: stretch;
        }

        /* Right Side: Tasks Display */
        .tasks-section {
            flex: 1;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tasks-section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            background-color: #fafafa;
        }

        .task-card h4 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #222;
        }

        .task-card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .badge-priority {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .task-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }

        .action-link {
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .edit-link { color: #007bff; }
        .delete-link { color: #dc3545; }

        .empty-message {
            color: #888;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- LEFT SIDE: FORM -->
        <div class="form-section">
            <h3>add new task</h3>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <input type="text" name="title" class="form-control" placeholder="Task title" required>
                </div>

                <div class="form-group">
                    <textarea name="description" class="form-control" placeholder="Task description..."></textarea>
                </div>

                <div class="row">
                    <input type="date" name="due_date" class="form-control" style="flex: 1;" required>
                    <select name="priority" class="form-control" style="flex: 1;">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <button type="submit" class="btn-add">Add Task</button>
            </form>
        </div>

        <div class="divider"></div>

        <!-- RIGHT SIDE: ALL TASKS LIST -->
        <div class="tasks-section">
            <h2>All Tasks</h2>
            
            <div class="tasks-list">
                {% for task in tasks %}
                    <div class="task-card">
                        <h4>{{ task.title }}</h4>
                        <p>{{ task.description|default:"" }}</p>
                        <div class="task-meta">
                            <span><strong>Due:</strong> {{ task.due_date }}</span>
                            <span class="badge-priority">{{ task.priority }}</span>
                        </div>
                        <div class="task-actions">
                            <a href="{% url 'update' task.id %}" class="action-link edit-link">Edit Task</a>
                            <a href="{% url 'delete' task.id %}" class="action-link delete-link">Delete Task</a>
                        </div>
                    </div>
                {% empty %}
                    <p class="empty-message">No tasks created yet.</p>
                {% endfor %}
            </div>
        </div>

    </div>

</body>
</html>
