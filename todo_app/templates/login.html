<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>Document</title>
</head>
<body>

    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow rounded-3 border-0">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 fs-4 fw-bold">Login</h3>

                    {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                    {% endif %}
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        
                        <div class="mb-3">
                            <label for="nameInput" class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" id="nameInput" placeholder="Enter your username" required>
                        </div>
                        
                        
                        
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Enter password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>






</body>
</html>
