{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>Document</title>
</head>
<body>

    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow rounded-3 border-0">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 fs-4 fw-bold">Register</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="nameInput" class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" id="nameInput" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label for="nameInput" class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" id="nameInput" placeholder="Enter your username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="emailInput" class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Enter password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Register</button>
                    </form>
                    
                    <div style="display: flex; align-items: center; margin: 20px 0;">
                    <div style="flex-grow: 1; height: 1px; background-color: #dee2e6;"></div>
                    <span style="padding: 0 12px; color: #6c757d; font-size: 13px; font-weight: 600;">OR</span>
                    <div style="flex-grow: 1; height: 1px; background-color: #dee2e6;"></div>
                    </div>
  
                <a href="{% provider_login_url 'google' %}" style="text-decoration: none; display: inline-block; width: 100%;">
                <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continue With Google</span>
                </button>
                </a>
                </div>
            </div>
        </div>
    </div>
</div>






</body>
</html>
